# Persistent STATE classification.
#
# Format: "path=<absolute path> <class>"
#   persistent  - user/application/OS configuration that must survive updates,
#                 rollback, and normal reboots
#   recreatable - state-backed but safe to delete/recreate
#   ephemeral   - tmpfs; never survives a reboot
#
# V1 intentionally keeps the persistent allowlist minimal. Add paths here only
# when the application has an explicit migration story.
schema=1
path=/home persistent
path=/var/lib/alloy persistent
path=/etc/alloy persistent
path=/var/cache recreatable
path=/var/log recreatable
path=/run ephemeral
path=/tmp ephemeral
path=/var/tmp ephemeral
