# Duranium initramfs configuration (image-owned).
# QEMU V1 uses virtio-blk devices; GPT labels are also supported by the block
# backend when these explicit paths are removed.

: "${DURANIUM_BACKEND:=block}"
: "${DURANIUM_BOOTLOADER:=systemd-boot}"
: "${DURANIUM_BOOT_MNT:=/mnt/boot}"
: "${DURANIUM_STATE_MNT:=/sysroot/state}"
: "${DURANIUM_RECOVERY_MNT:=/recovery}"
: "${DURANIUM_NEWROOT:=/sysroot}"
: "${DURANIUM_RUN:=/run/duranium}"
: "${DURANIUM_STATE_CONF:=/etc/duranium/state.conf}"
: "${DURANIUM_MAX_BOOT_ATTEMPTS:=3}"
: "${DURANIUM_CONSOLE:=console=ttyAMA0}"
: "${DURANIUM_EXTRA_CMDLINE:=}"
: "${DURANIUM_BOOT_DEV:=/dev/vda1}"
: "${DURANIUM_RECOVERY_DEV:=/dev/vda2}"
: "${DURANIUM_SLOT_A_DEV:=/dev/vda3}"
: "${DURANIUM_SLOT_B_DEV:=/dev/vda4}"
: "${DURANIUM_STATE_DEV:=/dev/vda5}"
